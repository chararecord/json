<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제이슨</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2032%2032%22%3E%3Crect%20width%3D%2232%22%20height%3D%2232%22%20rx%3D%227%22%20fill%3D%22%231e3a8a%22/%3E%3Ctext%20x%3D%2216%22%20y%3D%2222%22%20text-anchor%3D%22middle%22%20font-family%3D%22Menlo%2Cmonospace%22%20font-size%3D%2216%22%20font-weight%3D%22700%22%20fill%3D%22%23fff%22%3E%7B%20%7D%3C/text%3E%3C/svg%3E">
<style>
/* 레이아웃: 머리 → 입력 → 보는 방식 라벨(원문, 트리, 표, 경로 + FHIR일 때 점검, 표 만들기, 리소스, 환자) → 내용. 기획서 양식과 같은 회백 바탕, 강조는 남색 하나 */
:root{
  --bg:#fafaf9; --bg2:#ffffff; --line:#e6e6e3; --line2:#d2d2ce; --text:#191c1f; --dim:#4b5158; --faint:#666b73; --acc:#1e3a8a; --acc-soft:#e9edf7; --head:#f1f1ef;
  --key:#1e3a8a; --str:#2f6b45; --num:#a84a08; --bool:#6b3fa0; --null:#7a8089; --sel:#f1f1ef; --hl:#fff1bd; --red:#b42318;
  --body:Pretendard,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  --mono:"SF Mono",Menlo,ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#141517; --bg2:#1c1d20; --line:#2b2d31; --line2:#3a3d42; --text:#ebebe9; --dim:#b4b7bc; --faint:#969aa1; --acc:#9db4ff; --acc-soft:#1f2740; --head:#232528;
  --key:#9db4ff; --str:#8fd19e; --num:#ffb55c; --bool:#d4a5ff; --null:#80858c; --sel:#232528; --hl:#4a3f12; --red:#ff8a80;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#141517; --bg2:#1c1d20; --line:#2b2d31; --line2:#3a3d42; --text:#ebebe9; --dim:#b4b7bc; --faint:#969aa1; --acc:#9db4ff; --acc-soft:#1f2740; --head:#232528;
  --key:#9db4ff; --str:#8fd19e; --num:#ffb55c; --bool:#d4a5ff; --null:#80858c; --sel:#232528; --hl:#4a3f12; --red:#ff8a80;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 var(--body);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;word-break:keep-all;
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.meta{display:flex;gap:6px 14px;flex-wrap:wrap;color:var(--dim);font-size:12.5px}
.meta .ex{color:var(--acc);font-weight:600}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{height:32px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);padding:0 12px;border-radius:6px;background:var(--bg2);font-size:13px;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.on{background:var(--text);color:var(--bg2);border-color:var(--text)}
.view{flex:1;min-height:0;overflow:auto;padding:8px 0 max(24px,env(safe-area-inset-bottom,0px))}
.empty{color:var(--dim);padding:32px 8px}
.err{color:var(--red);padding:16px 8px}
.err p{margin:6px 0 0;color:var(--text)}
.err p.dm{color:var(--faint);font-size:12px}
/* 트리 */
.n{padding-left:16px}
.view>.n{padding-left:0}
.n>.l{display:flex;gap:6px;align-items:baseline;padding:1px 4px;border-radius:3px}
.n>.l:hover{background:var(--sel)}
.hit{background:var(--hl)!important}
.n.c>.l{cursor:pointer}
.tg{width:12px;color:var(--faint);flex:none;text-align:center}
.n.c.open>.l .tg::before{content:"▾"}
.n.c:not(.open)>.l .tg::before{content:"▸"}
.k{color:var(--key);flex:none;white-space:nowrap}
.k.i{color:var(--faint)}
.s{color:var(--str);white-space:pre-wrap;overflow-wrap:anywhere;min-width:0}
.v{color:var(--num)}
.b{color:var(--bool)}
.z{color:var(--null)}
.p{color:var(--faint)}
.sum{color:var(--faint);font-size:12px;white-space:nowrap}
.sum em.itag{color:var(--text)}
.sum em{font-style:normal;color:var(--dim);margin-left:6px}
.n:not(.open)>.kids{display:none}
.kids{border-left:1px solid var(--line);margin-left:9px}
.cp{visibility:hidden;color:var(--faint);font-size:11px;margin-left:4px;flex:none}
.n>.l:hover .cp{visibility:visible}
.cp:hover{color:var(--text)}
/* 표 */
.tblwrap{overflow:auto;max-height:70vh;margin:4px 0 8px 10px;border:1px solid var(--line);border-radius:4px;background:var(--bg2)}
table{border-collapse:collapse;font-size:12px;min-width:100%}
th,td{padding:3px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis}
th{color:var(--dim);font-weight:500;background:var(--bg);position:sticky;top:0;z-index:1}
td.r,th.r{text-align:right}
td>.s{white-space:nowrap}
tbody tr:hover td{background-color:var(--sel)}
td.db{min-width:11ch;background-image:linear-gradient(90deg,color-mix(in srgb,var(--key) 18%,transparent) var(--p),transparent var(--p));background-repeat:no-repeat;background-size:calc(100% - 8px) 70%;background-position:4px center}
.rk{color:var(--faint)}
td.rk{color:var(--key)}
.sub{display:inline;text-align:left;color:var(--dim)}
.sub .c{color:var(--faint);text-decoration:underline dotted;text-underline-offset:3px;margin-right:6px}
.sub:hover,.sub.on{color:var(--text)}
.sub.on .c{color:var(--acc);text-decoration-style:solid}
tr.subrow>td>div+div{margin-top:4px}
tr.subrow>td{white-space:normal;max-width:none;background:var(--bg);padding:4px 10px 6px 24px}
/* FHIR 보기 */
.btn:disabled{opacity:.45;cursor:default}
/* 데이터 점검 */
.ck-sum{display:flex;flex-wrap:wrap;gap:8px 32px;margin:6px 0 20px;padding:10px 14px;border:1px solid var(--line2);border-radius:6px;background:var(--bg2)}
.ck-j{display:block;text-align:left;border-radius:6px;padding:2px 6px;margin:-2px -6px}
.ck-j:hover{background:var(--acc-soft)}
.ck-j dd{text-decoration:underline dotted;text-underline-offset:4px}
.ck-sum dt{font-size:11px;color:var(--faint)}
.ck-sum dd{margin:0;font-size:18px;font-weight:600}
.ck-sum dd.warn,.wn{color:var(--red)}
.ck{margin-bottom:24px}
.ck h3{font-size:13px;font-weight:600;margin:0 0 6px}
.ck h3 i{font-style:normal;font-weight:400;color:var(--faint);margin-left:10px;font-size:12px}
.ck p{color:var(--dim);margin:4px 0 8px;max-width:90ch}
.ck .tblwrap{margin-left:0}
.ck-row{cursor:pointer}
.ck td.k{color:var(--key)}
.dm{color:var(--dim)}
.ck td.nm{max-width:420px}
.ck-det{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px 24px}
.ck-det h4{font-size:12px;font-weight:500;color:var(--dim);margin:0 0 4px}
.pl{color:var(--key);text-decoration:underline dotted;text-underline-offset:3px;margin:0 12px 3px 0;font-size:12px}
.pl:hover{color:var(--text)}
.rs{display:flex;flex-direction:column;gap:10px}
.rs-h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.rs-h b{font-size:15px}
.rs-w{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
.rs-w .v{color:var(--num)}
.rs-g{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px 28px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.rs-g h3,.rs-src{font-size:12px;font-weight:600;margin:0 0 6px}
.rs-g h3 i{display:block;font-style:normal;font-weight:400;color:var(--faint);font-size:11px}
.rs-c{display:grid;grid-template-columns:4em minmax(0,1fr) auto;gap:8px;align-items:baseline}
.rs-c .ok{color:var(--acc)}
.rs-c i{font-style:normal;color:var(--faint);font-size:11px}
.rs-r{display:flex;gap:8px;align-items:baseline;min-width:0;padding:1px 0}
.rs-r code{flex:none;max-width:16ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px}
.rs-r .pl{margin:0;text-align:left;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs-r .lb{flex:none;width:5em}
.refl{text-decoration:underline dotted;text-underline-offset:3px;text-align:left}
.refl:hover .s{color:var(--text)}
.raw>.pl{display:block;margin-bottom:4px}
.ln.focus{background:var(--hl)}
.pc .pl{margin:0;font-size:inherit;text-align:left}
.ck-li{display:flex;gap:8px;justify-content:space-between;max-width:340px}
.pt{border:1px solid var(--line2);background:var(--bg2);border-radius:6px;padding:12px 14px;margin:6px 0 12px;display:flex;flex-direction:column;gap:12px}
.pp{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--dim);padding-bottom:10px;border-bottom:1px dashed var(--line2)}
.pp select{border:1px solid var(--line2);border-radius:4px;background:var(--bg);padding:2px 6px;font-size:13px;max-width:100%}
.ph{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;color:var(--dim)}
.ph b{font-size:15px;color:var(--text);font-weight:600}
.pg{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px}
.pc h3{font-size:12px;font-weight:500;color:var(--dim);margin:0 0 4px}
.pc h3 i,.modes i,.chip i{font-style:normal;color:var(--faint);margin-left:4px}
.pc ul{margin:0;padding:0;list-style:none;max-height:168px;overflow:auto}
.pc li::before{content:"- ";color:var(--faint)}
.pc .none{margin:0;color:var(--faint)}
.pc dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:1px 12px;align-items:baseline}
.pc dt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc dt .pl{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc dd{margin:0;color:var(--num);text-align:right;white-space:nowrap}
.pc dd.d{color:var(--faint);font-size:11px}
.pg>.pc:has(dl){grid-column:span 2}
@media(max-width:720px){.pg>.pc:has(dl){grid-column:auto}}
.modes{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line2);margin-bottom:8px;position:sticky;top:0;background:var(--bg);z-index:2}
.modes button{padding:6px 10px 7px;border-bottom:2px solid transparent;margin-bottom:-1px;color:var(--dim)}
.modes button:hover{color:var(--text)}
.modes button.on{color:var(--text);border-bottom-color:var(--acc);font-weight:600}
details>summary{list-style:none;cursor:pointer}
details>summary::-webkit-details-marker{display:none}
.yr{display:flex;gap:10px;align-items:baseline;margin:18px 0 2px;padding:0 4px 4px;border-bottom:1px solid var(--line2);font-weight:600;font-size:14px}
.yr:first-child{margin-top:6px}
.yr i{font-style:normal;font-weight:400;font-size:12px;color:var(--faint)}
.enc>summary .dt{color:var(--dim);min-width:3.2em}
.sep{color:var(--faint);font-size:11px;margin:6px 0 2px 4px;padding-top:4px;border-top:1px dashed var(--line)}
.enc{border-bottom:1px solid var(--line)}
.enc>summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding:6px 4px;border-radius:3px}
.enc>summary::before{content:"▸";color:var(--faint);width:10px}
.enc[open]>summary::before{content:"▾"}
.enc>summary:hover,.ln:hover,.obs summary:hover{background:var(--sel)}
.dt{color:var(--faint);white-space:nowrap}
.enc .ty{font-weight:500}
.cls{font-size:11px;border:1px solid currentColor;border-radius:3px;padding:0 5px;color:var(--dim)}
.cls.c-EMER{color:var(--red)}
.cls.c-IMP{color:var(--num)}
.enc .rs,.enc .who{color:var(--dim);font-size:12px}
.enc .cnt{color:var(--faint);font-size:12px;white-space:pre-wrap}
.lns{padding:0 0 8px 26px}
.ln{display:grid;grid-template-columns:64px minmax(0,min(64ch,60%)) minmax(10ch,1fr);gap:2px 16px;padding:1px 4px;border-radius:3px;cursor:pointer;align-items:baseline}
.ln.d{grid-template-columns:64px 88px minmax(0,min(64ch,55%)) minmax(10ch,1fr)}
.ln.on{background:var(--sel)}
.ln.adm{color:var(--dim)}
.ln .ex{color:var(--num)}
.ln .wt i{color:var(--faint);font-style:normal}
.lb{color:var(--faint);font-size:12px}
.inf{font-size:10.5px;color:var(--dim);border:1px dashed var(--line2);border-radius:3px;padding:0 4px;margin-left:8px;white-space:nowrap}
.t-Condition{color:var(--bool)}
.t-Observation{color:var(--num)}
.t-Procedure{color:var(--str)}
.t-MedicationRequest,.t-MedicationAdministration,.t-Immunization{color:var(--key)}
.t-Encounter{color:var(--text)}
.raw{margin:2px 0 8px 64px;padding:6px 8px;border-left:1px solid var(--line2);background:var(--bg2)}
.obs .oh,.obs .orow{display:grid;grid-template-columns:minmax(0,1fr) 120px 48px 190px 96px minmax(88px,240px);gap:12px;padding:3px 4px;align-items:center}
.obs .oh{color:var(--faint);font-size:12px;border-bottom:1px solid var(--line2)}
.obs details{border-bottom:1px solid var(--line)}
.obs .r{text-align:right}
.obs .v{color:var(--num)}
.obs .wt,.obs .ca{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obs .ca{color:var(--dim);font-size:12px}
.spk{color:var(--num);display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}
.chip{border:1px solid var(--line2);border-radius:4px;padding:2px 9px;background:var(--bg2);font-size:12px}
.chip b{font-weight:500;color:var(--dim);margin-left:4px}
.chip.on{border-color:var(--text);background:var(--text);color:var(--bg2)}
.chip.on i,.chip.on b{color:var(--bg2);opacity:.7}
@media(max-width:640px){.bar .path{max-width:100%;margin-left:0}
  .ln,.ln.d{grid-template-columns:56px minmax(0,1fr)}.ln>*:not(.lb){grid-column:2}.ln .ex{text-align:left}
  .obs .oh{display:none}.obs .orow{grid-template-columns:minmax(0,1fr) auto 88px}.obs .orow>.ca,.obs .orow>.dt,.obs .orow>.r:nth-child(3){display:none}
  .raw{margin-left:0}.lns{padding-left:8px}}
/* 머리, 라벨 줄, 본문 */
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--bg2);font-weight:600}
.btn.pri:hover{color:var(--bg2);filter:brightness(1.12)}
.main{flex:1;display:flex;flex-direction:column;min-height:0;min-width:0;padding-top:14px}
.ctx{flex:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px;font-size:12.5px;color:var(--dim)}
#pickLabel{font-weight:600;color:var(--text)}
.ctx .cur{display:inline-flex;gap:10px;align-items:baseline;font-size:13.5px;max-width:100%}
.ctx .cur b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctx .cur span{font-size:12px;color:var(--acc)}
.pdrop{flex:none;margin:-2px 0 12px;border:1px solid var(--line2);border-radius:8px;background:var(--bg2);padding:10px;max-height:min(50vh,420px);display:flex;flex-direction:column}
.pdrop .pitems{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:4px;overflow:auto;min-height:0}
.pls{display:flex;flex-direction:column;gap:8px;min-height:0}
.pq{border:1px solid var(--line2);border-radius:6px;background:var(--bg);padding:5px 10px;font-size:13px}
.pq:focus{outline:0;border-color:var(--acc)}
.pi{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 10px;border-radius:6px;border:1px solid transparent;width:100%}
.pi b{font-weight:600;font-size:13.5px}
.pi b,.pi span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitems{overflow-x:hidden}
.pi span{font-size:11.5px;color:var(--faint)}
.pi:hover{background:var(--sel)}
.pi.on{background:var(--acc-soft);border-color:var(--acc)}
.pi.on b{color:var(--acc)}
#fpos{color:var(--faint)}
.pgs{font-size:12.5px;color:var(--dim);display:inline-flex;gap:6px;align-items:center}
.pgs select{border:1px solid var(--line2);border-radius:6px;background:var(--bg2);padding:3px 6px}
.n,.view code,.rs-r code,.k{font-family:var(--mono)}
.n{font-size:12.5px}
/* 리소스 고르기 */
.rb{display:grid;grid-template-columns:minmax(150px,190px) minmax(220px,300px) minmax(0,1fr);gap:20px;align-items:start}
.rb-types{position:sticky;top:0;max-height:calc(100vh - 230px);overflow:auto;display:flex;flex-direction:column;gap:2px}
.rt{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"l n" "k k";gap:0 8px;text-align:left;padding:5px 10px;border-radius:6px;border:1px solid transparent;width:100%}
.rt b{grid-area:l;font-weight:600;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt .k{grid-area:k;font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt i{grid-area:n;font-style:normal;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
.rt:hover{background:var(--sel)}
.rt.on{background:var(--acc-soft);border-color:var(--acc)}
.rt.on b,.rt.on i{color:var(--acc)}
.rb-list{position:sticky;top:0;max-height:calc(100vh - 230px);display:flex;flex-direction:column;gap:8px}
.rb-items{overflow:auto;border:1px solid var(--line);border-radius:6px;background:var(--bg2);min-height:0}
.rb-i{display:grid;grid-template-columns:84px minmax(0,1fr);gap:8px;width:100%;text-align:left;padding:4px 10px;border-bottom:1px solid var(--line);font-size:12.5px}
.rb-i span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rb-i:hover{background:var(--sel)}
.rb-i.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
@media(max-width:1100px){.rb{grid-template-columns:minmax(150px,180px) minmax(0,1fr)}.rb-main{grid-column:1/-1}}
@media(max-width:700px){.rb{grid-template-columns:1fr}.rb-types{position:static;max-height:none;flex-direction:row;flex-wrap:wrap}.rt{width:auto}.rt .k{display:none}.rb-list{position:static;max-height:none}.rb-items{max-height:240px}}
@media(max-width:640px){.vgrp{border-left:0;padding-left:0;margin-left:0}.vl{padding:6px 14px;font-size:14px}}
/* 원문, 경로 */
.code{display:grid;grid-template-columns:auto minmax(0,1fr);border:1px solid var(--line);border-radius:6px;background:var(--bg2);font:12.5px/1.6 var(--mono);overflow:auto}
.code pre{margin:0;padding:8px 12px;white-space:pre}
.code .ln-no{color:var(--faint);text-align:right;user-select:none;border-right:1px solid var(--line);background:var(--head)}
.code mark,.pv mark{background:var(--hl);color:inherit}
.morebtn{display:block;margin:4px 0 6px 16px;padding:3px 12px;border:1px dashed var(--line2);border-radius:999px;font-size:12px;color:var(--acc)}
.morebtn:hover{border-color:var(--acc)}
.pv{border:1px solid var(--line);border-radius:6px;background:var(--bg2);overflow:auto}
.pv button{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;width:100%;text-align:left;padding:2px 12px;border-bottom:1px solid var(--line);font:12.5px/1.6 var(--mono)}
.pv button:hover{background:var(--sel)}
.pv .pk{color:var(--key);overflow-wrap:anywhere}
.pv .pval{overflow-wrap:anywhere}
/* 첫 화면과 예시 표시 */
.welcome{max-width:640px;margin:24px auto;padding:20px 24px;border:1px solid var(--line2);border-radius:10px;background:var(--bg2);text-align:center}
.welcome h2{font-size:20px;margin:0 0 10px;text-wrap:balance}
.welcome p{margin:6px 0;color:var(--dim)}

const CLS={AMB:"외래",EMER:"응급",IMP:"입원",ACUTE:"입원",WELLNESS:"검진",VR:"원격",HH:"방문진료",OBSENC:"관찰"};
const rank=t=>{const i=ORDER.indexOf(t);return i<0?50:i};
const cc=x=>x&&(x.text||x.coding?.find(c=>c.display)?.display||x.coding?.[0]?.code)||"";
const day=s=>s?String(s).slice(0,10):"";

const when=r=>r.effectiveDateTime||r.effectivePeriod?.start||r.performedDateTime||r.performedPeriod?.start||r.occurrenceDateTime||r.authoredOn||r.onsetDateTime||r.recordedDate||r.period?.start||r.started||r.date||r.created||r.billablePeriod?.start||r.issued||"";
const qty=v=>v.value==null?"":`${Math.round(v.value*100)/100}${v.unit?" "+v.unit:""}`;
// 혈압은 수축기/이완기 한 값으로 쓴다 (LOINC 8480-6, 8462-4)
const bpPart=(r,code)=>r.component?.find(c=>c.code?.coding?.some(k=>k.code===code))?.valueQuantity;
const val=r=>{const sy=bpPart(r,"8480-6"),di=bpPart(r,"8462-4");
  if(sy&&di)return `${Math.round(sy.value)}/${Math.round(di.value)} ${sy.unit||""}`.trim();
  if(r.valueQuantity)return qty(r.valueQuantity);if(r.valueCodeableConcept)return cc(r.valueCodeableConcept);
  for(const k of["valueString","valueInteger","valueBoolean","valueDateTime"])if(r[k]!=null)return String(r[k]);
  if(r.component)return r.component.map(c=>`${cc(c.code).replace(/ blood pressure$/i,"")} ${val(c)}`).join(", ");return""};
const encOf=r=>rid(r.encounter?.reference||r.context?.reference||r.context?.encounter?.[0]?.reference||r.item?.[0]?.encounter?.[0]?.reference);
const pname=p=>{const n=p.name?.find(n=>n.use==="official")||p.name?.[0];return n?(n.text||[...(n.prefix||[]),...(n.given||[]),n.family].filter(Boolean).join(" ")):p.id};

function what(r){switch(r.resourceType){
  case"MedicationRequest":case"MedicationAdministration":case"MedicationStatement":return medName(r);
  case"Immunization":return cc(r.vaccineCode);
  case"DocumentReference":return cc(r.type);
  case"ImagingStudy":return cc(r.procedureCode?.[0])||r.series?.[0]?.modality?.display||"";
  case"Claim":case"ExplanationOfBenefit":return `${cc(r.type)} ${r.item?.length||0}항목`;
  case"CarePlan":return r.category?.map(cc).filter(Boolean).at(-1)||"";
  case"CareTeam":return(r.participant||[]).map(p=>p.member?.display).filter(Boolean).join(", ");
  case"Device":return cc(r.type);
  case"SupplyDelivery":return cc(r.suppliedItem?.itemCodeableConcept);
  case"Encounter":return cc(r.type?.[0]);
  case"Patient":return pname(r);

function extra(r){switch(r.resourceType){

function indexBundle(b,pid){

  const patients=all.filter(x=>x.r.resourceType==="Patient").map(x=>x.r);

  const enc=new Map(all.filter(x=>x.r.resourceType==="Encounter").map(x=>[x.r.id,{...x,kids:[]}]));
  const loose=[];
  for(const x of all){if(x.r.resourceType==="Encounter")continue;const e=enc.get(encOf(x.r));(e?e.kids:loose).push(x)}
  // encounter 참조가 없어도 시각이 어떤 방문 시간 안에 들면 그 방문에 넣는다 (Synthea 샘플 SupplyDelivery 2,507개 모두 해당)
  const ms=s=>s?Date.parse(s):NaN,encs=[...enc.values()];
  for(let k=loose.length-1;k>=0;k--){
    const x=loose[k],t=ms(when(x.r));if(isNaN(t)||x.r.resourceType==="Patient")continue;
    const e=encs.find(e=>ms(e.r.period?.start)<=t&&t<=(ms(e.r.period?.end)||ms(e.r.period?.start)));
    if(e){e.kids.push({...x,inf:true});loose.splice(k,1)}

}

async function scanAll(){
  const s={ok:0,bad:[],noPat:[],miss:{},pats:[],typeN:{},codes:new Map(),broken:[],cond:0,ext:0,total:0,bytes:0};
  for(let i=0;i<files.length;i++){
    $("#view").innerHTML=`<div class="empty">파일을 읽는 중이다. ${i+1} / ${files.length}</div>`;
    await new Promise(r=>setTimeout(r));
    s.bytes+=files[i].size;
    // 앞 64KB에 Bundle 표시가 없으면 FHIR가 아니라고 보고 전체를 읽지 않는다
    if(!/"resourceType"\s*:\s*"Bundle"/.test(await files[i].slice(0,65536).text())){s.bad.push([i,"FHIR Bundle이 아니다"]);continue}
    let b,t;try{t=await files[i].text();b=JSON.parse(t)}catch(e){s.bad.push([i,"JSON으로 읽지 못했다"]);continue}
    if(files.length===1)parsed={i,t,v:b};
    if(!isObj(b)||b.resourceType!=="Bundle"){s.bad.push([i,"FHIR Bundle이 아니다"]);continue}
    s.ok++;
    const ents=(b.entry||[]).filter(e=>isObj(e.resource)),ids=new Set(),pm=new Map();
    ents.forEach(e=>{const r=e.resource;if(e.fullUrl)ids.add(e.fullUrl);if(r.id){ids.add("urn:uuid:"+r.id);ids.add(r.resourceType+"/"+r.id)}
      if(r.resourceType==="Patient"){const o={file:i,pid:r.id,name:pname(r),gender:r.gender,birth:r.birthDate,dead:r.deceasedDateTime,types:{},enc:0,total:0,broken:0};pm.set(r.id,o);s.pats.push(o)}});
    if(!pm.size){const c={};ents.forEach(e=>c[e.resource.resourceType]=(c[e.resource.resourceType]||0)+1);s.noPat.push([i,ents.length,Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${t} ${n}`).join(", ")])}
    for(const{resource:r}of ents){
      const t=r.resourceType,po=t==="Patient"?pm.get(r.id):pm.get(patOf(r));
      s.total++;s.typeN[t]=(s.typeN[t]||0)+1;
      if(po){po.types[t]=(po.types[t]||0)+1;po.total++;if(t==="Encounter")po.enc++}
      walkRes(r,o=>{
        if(typeof o.reference==="string"){const f=o.reference;
          if(f.startsWith("#"));else if(f.includes("?"))s.cond++;else if(/^https?:/.test(f))s.ext++;else if(!ids.has(f)){s.broken.push({file:i,type:t,ref:f});if(po)po.broken++}}
        // 숫자 값이 있는 것은 단위(Quantity)라서 코드로 세지 않는다
        if(typeof o.system==="string"&&(typeof o.code==="string"||typeof o.code==="number")&&typeof o.value!=="number"){
          let m=s.codes.get(o.system);if(!m)s.codes.set(o.system,m=new Map());
          const k=String(o.code);let c=m.get(k);if(!c)m.set(k,c={d:"",n:0,pats:new Set(),types:new Set()});
          c.n++;c.types.add(t);if(po)c.pats.add(po);if(!c.d&&o.display)c.d=o.display}
      });
      for(const[f,src,ok]of reqCheck(r))if(!ok){const k=`${t}|${f}|${src}`;s.miss[k]=(s.miss[k]||0)+1}
    }
  }
  return s;
}

// 원문: 정리한 JSON에 색과 줄 번호를 붙인다. 검색어는 <mark>로 표시한다
const markQ=t=>{const e=esc(t);if(!q)return e;const qe=esc(q).replace(/[.*+?^${}()|[\]\\]/g,"\\$&");return e.replace(new RegExp(qe,"gi"),m=>(fcount++,`<mark>${m}</mark>`))};
function textHtml(){
  let t=JSON.stringify(data,null,2);const MAX=20000;let cutAt=-1;
  for(let k=0,pos=0;k<MAX;k++){pos=t.indexOf("\n",pos)+1;if(!pos){cutAt=-1;break}cutAt=pos}
  const cutN=cutAt>0&&cutAt<t.length;if(cutN)t=t.slice(0,cutAt-1);
  const re=/("(?:\\.|[^"\\])*")(\s*:)?|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false)\b|\b(null)\b/g;
  let out="",last=0,m;
  while((m=re.exec(t))){out+=markQ(t.slice(last,m.index));
    out+=m[1]?(m[2]?`<span class="k">${markQ(m[1])}</span>${m[2]}`:`<span class="s">${markQ(m[1])}</span>`):m[3]?`<span class="v">${markQ(m[3])}</span>`:m[4]?`<span class="b">${markQ(m[4])}</span>`:`<span class="z">null</span>`;
    last=re.lastIndex}
  out+=markQ(t.slice(last));
  const n=t.split("\n").length;
  return `${cutN?`<p class="more">앞 ${MAX.toLocaleString()}줄만 보인다. 나머지는 트리나 경로로 본다</p>`:""}<div class="code"><pre class="ln-no">${Array.from({length:n},(_,i)=>i+1).join("\n")}</pre><pre>${out}</pre></div>`;
}
// 경로: 값마다 한 줄. 줄을 누르면 경로를 복사한다
function pathsHtml(){
  const rows=[],MAX=3000,ql=q.toLowerCase();let total=0;
  const walk=(v,p)=>{
    if(!q&&rows.length>=MAX){total=-1;return}
    if(isScalar(v)||(typeof v==="object"&&!Object.keys(v).length)){if(total>=0)total++;
      const sv=isScalar(v)?String(v):JSON.stringify(v);
      if(!q||p.toLowerCase().includes(ql)||sv.toLowerCase().includes(ql)){fcount++;if(rows.length<MAX)rows.push([p,v])}
      return}
    for(const k in v){walk(v[k],childPath(p,k,Array.isArray(v)));if(total<0)return}
  };walk(data,"$");
  return `<p class="more">${total<0?`앞 ${MAX.toLocaleString()}개만 보인다. 검색으로 좁힌다`:`값 ${total.toLocaleString()}개${q?`, 검색어에 맞는 것 ${fcount.toLocaleString()}개`:""}${q&&rows.length<fcount?`. 앞 ${MAX.toLocaleString()}개만 보인다`:""}`}. 줄을 누르면 경로를 복사한다</p><div class="pv">${rows.map(([p,v])=>`<button data-cp="${esc(p)}"><span class="pk">${markQ(p)}</span><span class="pval">${isScalar(v)?scalarHtml(v):`<span class="p">${Array.isArray(v)?"[]":"{}"}</span>`}</span></button>`).join("")}</div>`;
}
function setMeta(parts){$("#meta").innerHTML=parts.filter(Boolean).map(p=>`<span>${p}</span>`).join("")}
// JSON 오류 위치를 줄과 글자 번호로 바꿔 한국어로 알린다
function showParseError(text,name,e){
  const m=String(e.message),lc=m.match(/line (\d+) column (\d+)/),pos=m.match(/position (\d+)/);
  let where="";
  if(lc)where=`${lc[1]}번째 줄 ${lc[2]}번째 글자 근처`;
  else if(pos){const before=text.slice(0,+pos[1]);const ln=before.split("\n").length;where=`${ln}번째 줄 ${+pos[1]-before.lastIndexOf("\n")}번째 글자 근처`}
  const end=/end of (JSON )?input|Unterminated/i.test(m);
  data=undefined;fx=null;isEx=false;render();
  setMeta([esc(name||"붙여넣기"),"읽지 못했다"]);
  $("#views").hidden=true;
  $("#view").innerHTML=`<div class="err"><b>「${esc(name||"붙여넣은 내용")}」을 JSON으로 읽지 못했다.</b><p>${end?"파일이 중간에 끊긴 것 같다. 끝부분의 괄호가 닫혔는지 확인한다.":`${where||"어딘가"}에서 문법이 맞지 않는다. 따옴표, 쉼표, 괄호 짝을 확인한다.`}</p><p class="dm">브라우저가 알려 준 원문: ${esc(m)}</p></div>${welcomeHtml()}`;
}
function load(text,name,isExample,pre){
  let v=pre;
  if(v===undefined){text=text.trim();if(!text)return;
  try{v=JSON.parse(text)}
  catch(e){
    const lines=text.split(/\r?\n/).filter(l=>l.trim());
    try{if(lines.length<2)throw e;v=lines.map(l=>JSON.parse(l))}
    catch(e2){showParseError(text,name,e);return}
  }}
  hitMemo=new WeakMap();more.clear();isEx=!!isExample||/^예시_/.test(name||"");
  data=v;fx=isObj(v)&&v.resourceType==="Bundle"?indexBundle(v):null;mode="tl";
  focus={};obsFocus=null;resSel=null;resHist=[];
  const top=fx?`Bundle ${esc(v.type||"")}, 리소스 ${v.entry?.length||0}개${fx.patients.length>1?`, 환자 ${fx.patients.length}명`:""}`:Array.isArray(v)?`배열 ${v.length}개`:isObj(v)?`키 ${Object.keys(v).length}개`:"값 하나";
  setMeta(scan?scanMeta():[isExample?`<span class="ex">예시 데이터</span>`:esc(name),fmtBytes(files[cur]?.size??text.length),`노드 ${count(v).toLocaleString()}개`,`최상위 ${top}`]);
  render();
}

function toggleSub(btn,force){
  const tr=btn.closest("tr");let sr=tr.nextElementSibling;
  if(!sr?.classList.contains("subrow")){tr.insertAdjacentHTML("afterend",`<tr class="subrow"><td colspan="${tr.children.length}"></td></tr>`);sr=tr.nextElementSibling}
  const id=btn.dataset.sub,ex=[...sr.cells[0].children].find(d=>d.dataset.sub===id);
  if(ex&&force!==true){ex.remove();btn.classList.remove("on");if(!sr.cells[0].children.length)sr.remove()}
  else if(!ex){sr.cells[0].insertAdjacentHTML("beforeend",subHtml(+id));btn.classList.add("on")}
}
